name: probar-relevo

# Workflow temporal de comprobacion: verifica que el token PAT_CCBOT puede
# lanzar la vigilancia, que es lo que hara el relevo. Se borra tras usarlo.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que PAT_CCBOT puede lanzar la vigilancia
        env:
          PAT: ${{ secrets.PAT_CCBOT }}
        run: |
          set -u
          if [ -z "${PAT:-}" ]; then
            echo "::error::El secret PAT_CCBOT no existe o esta vacio."
            exit 1
          fi
          codigo=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ccbot.yml/dispatches" \
            -d '{"ref":"main","inputs":{"vigilancia_minutos":"330","intervalo_segundos":"300"}}')
          echo "Respuesta de GitHub: HTTP $codigo"
          if [ "$codigo" = "204" ]; then
            echo "RESULTADO: OK. El token puede lanzar la vigilancia, el relevo funcionara."
          else
            echo "::error::RESULTADO: el token NO sirve (HTTP $codigo)."
            echo "Revisa que tenga permiso de repositorio 'Actions: Read and write'"
            echo "y que el repositorio seleccionado sea AlejandroLay/ccbot."
            cat /tmp/r.json || true
            exit 1
          fi
