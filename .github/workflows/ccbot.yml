name: ccbot

on:
  schedule:
    # Cada 10 minutos. OJO: esto SOLO es sostenible con el repo publico, donde
    # los minutos de Actions son ilimitados. Con el repo privado son 4.320
    # minutos al mes contra 2.000 gratuitos, y el bot se pararia a mitad de mes.
    #
    # Historia: pedimos cada 30 minutos del 7 al 16 de septiembre de 2026 y
    # GitHub solo ejecutaba 6-8 veces al dia, con huecos de cinco horas. Las
    # ejecuciones programadas son lo primero que recorta el plan gratuito, y
    # por eso existe el modo vigilancia de abajo.
    - cron: "3,13,23,33,43,53 * * * *"

  workflow_dispatch:
    inputs:
      seed:
        description: "Marcar todo como visto SIN avisar"
        type: boolean
        default: false
      vigilancia_minutos:
        description: "Vigilancia continua: minutos que se queda dando pasadas (0 = una sola pasada)"
        type: string
        # 330 y no 0 A PROPOSITO. El relevo lanza la siguiente vigilancia por
        # API y los inputs que no se envian toman ESTE valor. Con default 0,
        # cada relevo haria una pasada de minuto y medio y volveria a relevarse:
        # un bucle infinito de ejecuciones que acabaria con la cuenta limitada.
        default: "330"
      intervalo_segundos:
        description: "Segundos entre pasadas cuando hay vigilancia continua"
        type: string
        default: "300"

# Una sola ejecucion a la vez: dos procesos escribiendo el mismo estado se
# pisarian. Las que lleguen mientras hay una en marcha esperan su turno y
# arrancan en cuanto la anterior termina.
concurrency:
  group: ccbot
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    # El maximo que permite GitHub son 360 minutos; dejamos margen.
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      - name: Vigilar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MINUTOS: ${{ inputs.vigilancia_minutos }}
          INTERVALO: ${{ inputs.intervalo_segundos }}
          SEED: ${{ inputs.seed }}
        run: |
          set -u
          # Marca de arranque, para que el relevo pueda saber cuanto ha vivido
          # esta vigilancia y negarse a encadenar ejecuciones que mueren rapido.
          echo "INICIO_VIGILANCIA=$(date +%s)" >> "$GITHUB_ENV"
          # En las ejecuciones programadas los inputs llegan vacios. Por defecto
          # vigilamos 330 minutos: asi UNA ejecucion cubre cinco horas y media
          # dando pasadas cada 5 minutos, y la siguiente programada, que espera
          # en cola por el grupo de concurrencia, arranca en el momento en que
          # esta termina. Cobertura continua 24/7 sin depender de que el cron
          # entre puntual, que es lo que no hacia (huecos de cinco horas, justo
          # de madrugada, que es cuando la tienda sube el genero nuevo).
          [ -z "${MINUTOS:-}" ] && MINUTOS=330
          [ -z "${INTERVALO:-}" ] && INTERVALO=300
          FLAGS=""
          [ "${SEED:-false}" = "true" ] && FLAGS="--seed"

          git config user.name "ccbot"
          git config user.email "ccbot@users.noreply.github.com"

          fin=$(( $(date +%s) + MINUTOS * 60 ))
          pasada=0

          guardar_estado() {
            # Latido: cambia una vez al dia, asi que garantiza un commit diario.
            # Sin actividad 60 dias, GitHub desactiva los workflows programados.
            date -u +%Y-%m-%d > state/_latido.txt
            git add state/
            if ! git diff --staged --quiet; then
              git commit -q -m "Estado: $(date -u +'%Y-%m-%d %H:%M') UTC"
              # Otra ejecucion puede haber publicado estado mientras tanto.
              git pull --rebase -q || { git rebase --abort 2>/dev/null || true; git reset --hard -q origin/main; return 0; }
              git push -q || true
            fi
          }

          while :; do
            pasada=$(( pasada + 1 ))
            echo "::group::pasada $pasada  $(date -u +'%H:%M:%S') UTC"
            # Una pasada que falle no debe cortar la vigilancia: el bot ya
            # registra el ERROR y seguimos con la siguiente.
            python cc_bot.py $FLAGS || echo "La pasada $pasada ha fallado, continuo"
            guardar_estado
            echo "::endgroup::"

            ahora=$(date +%s)
            [ "$ahora" -ge "$fin" ] && break
            # No dormir mas alla del final de la vigilancia.
            restante=$(( fin - ahora ))
            [ "$restante" -lt "$INTERVALO" ] && INTERVALO="$restante"
            sleep "$INTERVALO"
          done

          echo "Vigilancia terminada: $pasada pasada(s)."
          echo "VIGILANCIA_OK=1" >> "$GITHUB_ENV"

      - name: Relevar con la siguiente vigilancia
        # Sin esto, la siguiente vigilancia solo empieza cuando el cron de
        # GitHub tiene a bien entrar, que en el plan gratuito son 2-4 horas de
        # hueco. Con el relevo, la cadena no se rompe nunca.
        if: always()
        env:
          PAT: ${{ secrets.PAT_CCBOT }}
          MINIMO_PARA_RELEVAR: "1800"   # 30 minutos
        run: |
          set -u
          if [ -z "${PAT:-}" ]; then
            echo "::warning::Sin el secret PAT_CCBOT no hay relevo: la siguiente"
            echo "::warning::vigilancia depende del cron de GitHub, que en el plan"
            echo "::warning::gratuito entra cada 2-4 horas. Habra huecos sin vigilar."
            exit 0
          fi

          # Cinturon de seguridad contra el bucle infinito: solo se releva a una
          # vigilancia que haya terminado bien Y haya durado mas de media hora.
          # Si algo esta roto (config invalida, WAF bloqueando) la ejecucion
          # muere en un minuto, y encadenar seria lanzar ejecuciones sin parar.
          # En ese caso callamos y deja que el cron reanude, con el fallo a la
          # vista en rojo.
          if [ "${VIGILANCIA_OK:-0}" != "1" ]; then
            echo "::warning::La vigilancia no termino bien: no relevo para no"
            echo "::warning::encadenar fallos. El cron reanudara la cadena."
            exit 0
          fi
          vivido=$(( $(date +%s) - ${INICIO_VIGILANCIA:-0} ))
          if [ "$vivido" -lt "$MINIMO_PARA_RELEVAR" ]; then
            echo "::warning::La vigilancia solo ha durado ${vivido}s (minimo para"
            echo "::warning::relevar: ${MINIMO_PARA_RELEVAR}s). No relevo, por si es"
            echo "::warning::un fallo que se repetiria en bucle."
            exit 0
          fi

          # Los inputs van explicitos: lo que no se manda toma el default del
          # workflow, y depender de eso es como se cuela un bucle infinito.
          codigo=$(curl -sS -o /tmp/relevo.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ccbot.yml/dispatches" \
            -d '{"ref":"main","inputs":{"vigilancia_minutos":"330","intervalo_segundos":"300"}}')
          if [ "$codigo" = "204" ]; then
            echo "Relevo lanzado: la siguiente vigilancia arranca al cerrar esta."
          else
            echo "::error::El relevo ha fallado (HTTP $codigo). Revisa que PAT_CCBOT"
            echo "::error::siga vigente y con permiso de Actions: leer y escribir."
            cat /tmp/relevo.json || true
            exit 1
          fi
